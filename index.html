<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="30 OTOMAD CHALLENGEの参加者・お題・選出動画を探せる閲覧専用データベース"><title>30 OTOMAD CHALLENGE DB｜閲覧専用</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#0e1322;color:#e9edff}*{box-sizing:border-box}body{margin:0}a{color:#9cbaff}header{background:linear-gradient(125deg,#1c2850,#101626);padding:30px max(18px,calc((100vw - 1120px)/2));border-bottom:1px solid #33405f}h1{margin:0;font-size:clamp(23px,4vw,35px)}header p{color:#aebbd9;margin:8px 0 0}.wrap{max-width:1120px;margin:auto;padding:22px 16px 60px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#1b2440;border:1px solid #344260;border-radius:12px;padding:14px 22px;min-width:145px}.stat b{font-size:24px;display:block}.stat small,.muted{color:#a8b5d3}.toolbar,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,select,input{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid #46567b;background:#1b2540;color:#e9edff}button{cursor:pointer}button.active{background:#4567b5;border-color:#7895d9}input{min-width:200px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.card{background:#1a2339;border:1px solid #34425d;border-radius:12px;padding:15px;min-width:0}.card h3{margin:0 0 8px;font-size:17px;overflow-wrap:anywhere}.card p{margin:7px 0;color:#aebbd5}.card button{width:100%;margin-top:8px}.media{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#1a2339;border:1px solid #34425d;border-radius:12px;min-width:0}.media img{width:135px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#2b354c;flex-shrink:0}.media .body{min-width:0;overflow-wrap:anywhere}.media strong{font-size:14px}.media small{display:block;color:#aebbd5;margin-top:5px}.media-list{display:grid;gap:10px}.back{margin-bottom:18px}.detail-title{margin:4px 0 18px}.slot{display:grid;grid-template-columns:60px minmax(0,1fr);align-items:start;gap:12px}.slot-num{padding-top:12px;font-weight:700;color:#b4c8ff}.empty{color:#8b9cba;padding:12px}.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.rank{font-weight:bold;color:#bfd1ff}.notice{color:#aebbd5;font-size:13px;margin:0 0 18px}.hidden{display:none!important}@media(max-width:580px){.media img{width:102px}.stat{flex:1;min-width:95px;padding:11px}.stat b{font-size:21px}.slot{grid-template-columns:36px minmax(0,1fr);gap:7px}}
</style></head><body><header><h1>30 OTOMAD CHALLENGE <span style="color:#9cbaff">DB</span></h1><p>参加者別・お題別・動画別に30本を探せる非公式データベース</p></header><main class="wrap"><div class="stats"><div class="stat"><b id="countPeople">—</b><small>参加者</small></div><div class="stat"><b id="countSlots">—</b><small>登録作品枠</small></div><div class="stat"><b id="countVideos">—</b><small>ユニーク動画ID</small></div></div><p class="notice">閲覧専用の公開版です。登録・編集・削除機能はありません。非公開・削除・取得不可の動画はIDや登録タイトルのみ表示される場合があります。</p><nav class="toolbar"><button data-tab="people" class="active">参加者別</button><button data-tab="topics">お題別</button><button data-tab="videos">動画別・ランキング</button></nav><div id="browse"><div class="controls"><input id="search" placeholder="参加者名・タイトル・動画ID・お題で検索" aria-label="検索"><select id="topicFilter" aria-label="お題で絞り込み"><option value="">全お題</option></select></div><div id="results"></div></div><div id="detail" class="hidden"></div></main><script>
'use strict';let db=[],metadata={},TOPICS=[],tab='people';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const titleAt=(p,i)=>String(p.titleOnly?.[i]||'').trim();function videoLink(id){if(/^(?:sm|nm|so)\d+$/i.test(id))return 'https://www.nicovideo.jp/watch/'+encodeURIComponent(id.toLowerCase());if(/^BV[0-9A-Za-z]{10}$/.test(id))return 'https://www.bilibili.com/video/'+encodeURIComponent(id);if(/^https?:\/\//i.test(id))return id;if(/^[\w-]{11}$/.test(id))return 'https://www.youtube.com/watch?v='+encodeURIComponent(id);return ''}function rows(){return db.flatMap(p=>p.ids.map((id,i)=>({id,topic:i+1,person:p})).filter(r=>r.id))}function media(id,sub=''){const m=metadata[id]||{},url=videoLink(id),title=m.title||id,thumb=m.thumbnail||'';const content=`<strong>${esc(title)}</strong>`;return `<article class="media">${thumb?`<div>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">`:''}<img src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">${url?'</a>':''}</div>`:''}<div class="body">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${content}</a>`:content}<small>${esc(sub||id)}</small>${m.author?`<small>投稿者：${esc(m.author)}</small>`:''}${!m.title?'<small>動画情報未取得</small>':''}</div></article>`}function titleOnly(t){return `<article class="media"><div class="body"><strong>${esc(t)}</strong><small>タイトルのみ登録（リンクなし）</small></div></article>`}function pHash(p){return '#person/'+encodeURIComponent(p.handle)+'/'+encodeURIComponent(p.author)}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#detail').classList.add('hidden');$('#browse').classList.remove('hidden');render()}function render(){let q=$('#search').value.trim().toLowerCase(),f=Number($('#topicFilter').value)||0;let html='';if(tab==='people'){const people=db.filter(p=>{let indexes=f?[f-1]:p.ids.map((_,i)=>i);return indexes.some(i=>[p.author,p.handle,p.ids[i],titleAt(p,i),metadata[p.ids[i]]?.title].some(x=>String(x||'').toLowerCase().includes(q)))});html=`<div class="grid">${people.map(p=>`<article class="card"><h3>${esc(p.author)}</h3><p>@${esc(p.handle)}</p><p>${p.ids.filter(Boolean).length+(p.titleOnly||[]).filter(Boolean).length}/30件登録</p><button data-person="${esc(pHash(p))}">30件を見る</button></article>`).join('')}</div>`}else if(tab==='topics'){html=`<div class="topic-grid">${TOPICS.map((t,i)=>({t,i})).filter(x=>(!f||x.i===f-1)&&(!q||x.t.toLowerCase().includes(q)||rows().some(r=>r.topic===x.i+1&&[r.person.author,r.id,metadata[r.id]?.title].some(v=>String(v||'').toLowerCase().includes(q))))).map(x=>`<article class="card"><h3>${x.i+1}. ${esc(x.t)}</h3><p>${db.filter(p=>p.ids[x.i]||titleAt(p,x.i)).length}件</p><button data-topic="${x.i+1}">作品を見る</button></article>`).join('')}</div>`}else{const counts=new Map();for(const r of rows()){if(f&&r.topic!==f)continue;let a=counts.get(r.id)||{id:r.id,n:0,people:new Set()};a.n++;a.people.add(r.person.author);counts.set(r.id,a)}const list=[...counts.values()].filter(x=>[x.id,metadata[x.id]?.title,metadata[x.id]?.author,[...x.people].join(' ')].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>b.n-a.n||a.id.localeCompare(b.id));html=`<p class="muted">${list.length}作品</p><div class="media-list">${list.map((x,i)=>`<div><div class="rank">${i+1}位・${x.n}件選出</div>${media(x.id,[...x.people].join('、'))}</div>`).join('')}</div>`}$('#results').innerHTML=html||'<p class="muted">該当するデータはありません。</p>';document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>location.hash=b.dataset.person);document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>location.hash='topic/'+b.dataset.topic)}function showDetail(content){$('#browse').classList.add('hidden');$('#detail').classList.remove('hidden');$('#detail').innerHTML=`<button class="back" id="back">← 一覧に戻る</button>`+content;$('#back').onclick=()=>location.hash=tab}function showPerson(p){showDetail(`<h2 class="detail-title">${esc(p.author)} — 30件の選出作品</h2><p class="muted">@${esc(p.handle)}　${p.post?`<a href="${esc(p.post)}" target="_blank" rel="noopener noreferrer">元ポストを見る</a>`:''}</p><div class="media-list">${p.ids.map((id,i)=>`<div class="slot"><div class="slot-num">${i+1}.</div><div><p>${esc(TOPICS[i])}</p>${id?media(id):titleAt(p,i)?titleOnly(titleAt(p,i)):'<div class="empty">未登録</div>'}</div></div>`).join('')}</div>`)}function showTopic(i){showDetail(`<h2>${i}. ${esc(TOPICS[i-1])}</h2><div class="media-list">${db.filter(p=>p.ids[i-1]||titleAt(p,i-1)).map(p=>`<div><p><a href="${esc(pHash(p))}">${esc(p.author)}</a></p>${p.ids[i-1]?media(p.ids[i-1]):titleOnly(titleAt(p,i-1))}</div>`).join('')}</div>`)}function route(){let hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('person/')){let parts=hash.slice(7).split('/'),p=db.find(p=>p.handle===parts[0]&&p.author===parts.slice(1).join('/'));if(p)return showPerson(p)}if(hash.startsWith('topic/')){let i=Number(hash.slice(6));if(i>=1&&i<=30)return showTopic(i)}setTab(['people','topics','videos'].includes(hash)?hash:'people')}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>location.hash=b.dataset.tab);$('#search').oninput=render;$('#topicFilter').onchange=render;window.addEventListener('hashchange',route);fetch('./data.json').then(r=>{if(!r.ok)throw Error('データの読み込みに失敗しました');return r.json()}).then(d=>{db=d.people;metadata=d.metadata;TOPICS=d.topics;$('#countPeople').textContent=db.length;$('#countSlots').textContent=db.reduce((n,p)=>n+p.ids.filter(Boolean).length+(p.titleOnly||[]).filter(Boolean).length,0);$('#countVideos').textContent=new Set(rows().map(r=>r.id)).size;$('#topicFilter').innerHTML='<option value="">全お題</option>'+TOPICS.map((t,i)=>`<option value="${i+1}">${i+1}. ${esc(t)}</option>`).join('');route()}).catch(e=>{$('#results').innerHTML='<p>データを読み込めませんでした。Webサーバーに配置して開いてください。</p>';console.error(e)});
</script></body></html>
